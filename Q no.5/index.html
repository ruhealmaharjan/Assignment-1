<!DOCTYPE html>
<html>
<head>
    <title>List Example</title>
</head>
<body>

    <h2>Ordered List of Subjects</h2>
    <ol>
        <li>Web Technology</li>
        <li>Java</li>
        <li>Statistics</li>
        <li>System Analysis</li>
        <li>Data Structure</li>
    </ol>

    <h2>Unordered List of Hobbies</h2>
    <ul>
        <li>Reading</li>
        <li>Playing Football</li>
        <li>Listening to Music</li>
        <li>Traveling</li>
        <li>Gaming</li>
    </ul>

</body>
</html>
